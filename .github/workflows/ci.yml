name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_call: {}

# Force JavaScript-based actions to run on Node 24 instead of the deprecated Node 20 ahead of
# the 2026-06-16 hard cutover, until we bump each action to a Node-24-native major version.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    # net45 + net47 WPF targets require Windows + .NET Framework targeting packs.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ImageResizerLibrary references the sibling repo's System.Drawing.Extensions via a
      # ProjectReference (so live upstream changes flow without a NuGet pack/publish hop).
      # GitHub Actions' actions/checkout `path:` cannot escape the workspace, so we drop the
      # sibling under <consumer>/.sibling/ — the consumer's csproj probes both this and the
      # local-dev layout (../../C--FrameworkExtensions) before falling back to NuGet.
      - name: Checkout sibling C--FrameworkExtensions
        uses: actions/checkout@v4
        with:
          repository: Hawkynt/C--FrameworkExtensions
          path: .sibling/C--FrameworkExtensions
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'            # SDK only; actual targets are net45/net47

      - name: Stamp versions
        shell: bash
        run: perl .github/workflows/scripts/version.pl --stamp

      # Paint.NET reference assemblies live under PixelArtScalingPlugin/External/
      # so the whole solution (exe + plugin) builds in CI without any download step.
      - name: Restore solution
        run: dotnet restore ImageResizer.sln

      - name: Build solution
        run: dotnet build ImageResizer.sln --configuration Release --no-restore

      # No test projects exist in this repo -- build success is the only CI signal.
      - name: No tests to run
        run: echo "No test project -- build-only CI."
